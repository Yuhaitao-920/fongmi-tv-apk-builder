name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Build flavor'
        required: true
        default: 'mobileArm64_v8a'
        type: choice
        options:
          - mobileArm64_v8a
          - mobileArmeabi_v7a
          - leanbackArm64_v8a
          - leanbackArmeabi_v7a
      create_release:
        description: 'Create a GitHub Release with the APK'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Prepare source tree
        run: |
          if [ -f app-source/gradlew ]; then
            echo "Using synced app-source/ (commit: $(git -C app-source log -1 --oneline 2>/dev/null || echo unknown))"
          else
            echo "app-source is empty; cloning upstream for this build"
            git clone --depth 1 --branch fongmi https://github.com/FongMi/TV.git app-source
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0"
          yes | sdkmanager --licenses || true

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Write local.properties
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > app-source/local.properties

      - name: Build APK
        working-directory: app-source
        run: |
          FLAVOR="${{ github.event.inputs.flavor || 'mobileArm64_v8a' }}"
          TASK=":app:assemble${FLAVOR}Debug"
          echo "Running $TASK"
          bash gradlew "$TASK" --no-daemon

      - name: Locate APK
        id: apk
        run: |
          FLAVOR="${{ github.event.inputs.flavor || 'mobileArm64_v8a' }}"
          APK=$(find app-source/app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK found for $FLAVOR" >&2
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.flavor || 'mobileArm64_v8a' }}
          path: ${{ steps.apk.outputs.path }}

      - name: Create release
        if: ${{ github.event.inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          files: ${{ steps.apk.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
