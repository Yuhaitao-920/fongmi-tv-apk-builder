name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Build flavor (device type)'
        required: true
        default: 'mobile'
        type: choice
        options:
          - mobile
          - leanback
      build_type:
        description: 'Build type'
        required: true
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release
      create_release:
        description: 'Create a GitHub Release with the APK(s)'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4

      - name: Prepare source tree
        run: |
          if [ -f app-source/gradlew ]; then
            echo "Using synced app-source/ ($(git -C app-source log -1 --oneline 2>/dev/null || echo 'no git history'))"
          else
            echo "app-source is empty; cloning upstream FongMi/TV@fongmi for this build"
            git clone --depth 1 --branch fongmi https://github.com/FongMi/TV.git app-source
          fi
          grep -E 'versionName|versionCode' app-source/app/build.gradle | head -5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        # ubuntu-latest runners ship with Android SDK + cmdline-tools preinstalled;
        # avoid android-actions/setup-android, which still installs the removed 'tools' package.
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          SDKMANAGER=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;37.0.0"

      - name: Set up Python 3.10 (ChaquoPy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Write local.properties
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > app-source/local.properties

      - name: Build APK
        working-directory: app-source
        run: |
          FLAVOR="${{ github.event.inputs.flavor || 'mobile' }}"
          TYPE="${{ github.event.inputs.build_type || 'Debug' }}"
          TASK=":app:assemble$(echo "$FLAVOR" | sed 's/^./\U&/')${TYPE}"
          echo "Running $TASK"
          bash gradlew "$TASK" --no-daemon --stacktrace

      - name: Collect APKs
        id: apk
        run: |
          FLAVOR="${{ github.event.inputs.flavor || 'mobile' }}"
          TYPE="${{ github.event.inputs.build_type || 'Debug' }}"
          LOWER_TYPE=$(echo "$TYPE" | tr '[:upper:]' '[:lower:]')
          OUTDIR="app-source/app/build/outputs/apk/${FLAVOR}/${LOWER_TYPE}"
          echo "Looking in $OUTDIR"
          find "$OUTDIR" -type f -name '*.apk' -printf '%p\n' 2>/dev/null || true
          COUNT=$(find "$OUTDIR" -type f -name '*.apk' 2>/dev/null | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "No APK found in $OUTDIR" >&2
            exit 1
          fi
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fongmi-tv-${{ github.event.inputs.flavor || 'mobile' }}-${{ github.event.inputs.build_type || 'Debug' }}
          path: app-source/app/build/outputs/apk/${{ github.event.inputs.flavor || 'mobile' }}/${{ github.event.inputs.build_type == 'Release' && 'release' || 'debug' }}/**/*.apk
          if-no-files-found: error

      - name: Create release
        if: ${{ github.event.inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: FongMi TV build ${{ github.run_number }}
          files: app-source/app/build/outputs/apk/${{ github.event.inputs.flavor || 'mobile' }}/${{ github.event.inputs.build_type == 'Release' && 'release' || 'debug' }}/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
